s(p.stars,p.category)}</div>${p.retired?`<div class="setting"><strong>❄ Reason for retirement</strong><p>${esc(p.retirementReason||'No reason recorded')}</p></div>`:`<div class="actions"><button class="ghost" onclick="adjust('${id}',-1);openProfile('${id}')">− Deduct heart</button><button class="primary" onclick="adjust('${id}',1);openProfile('${id}')">+ Restore heart</button></div>`}<div class="setting"><div class="flex"><span class="muted subtle">Lifetime deductions</span><strong>${p.losses||0}</strong></div>${p.birthday?`<p>Birthday: ${esc(p.birthday)}</p>`:''}<div class="noteheading"><strong>📌 Pinned notes</strong><button class="rowbtn" onclick="openPinnedNote('${id}')">＋ ${p.notes?'Edit':'Add'} pinned note</button></div><p style="white-space:pre-wrap">${esc(p.notes||'No pinned notes yet.')}</p></div><div class="setting"><strong>How we met</strong><p style="white-space:pre-wrap">${esc(p.howMet||'Not recorded yet')}</p><strong>What we talked about</strong><p style="white-space:pre-wrap">${esc(p.talkedAbout||'Not recorded yet')}</p></div><div class="sectionhead"><h3>Personal journal</h3><span class="badge">${(p.journal||[]).length} entries</span></div><form onsubmit="addJournal(event,'${id}')"><label class="formlabel">When did it happen?</label><input class="field" type="date" name="entryDate" required value="${todayLocal()}"><label class="formlabel" for="journalentry">Add a moment, note, or event</label><textarea id="journalentry" class="field" name="entry" maxlength="5000" required placeholder="What happened today? The good, the bad, the hilarious..."></textarea><div class="actions"><button class="primary" type="submit">＋ Save journal entry</button></div></form><div class="journalentries">${[...(p.journal||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(j=>`<div class="event"><div class="flex"><time>${fmt(j.date)}</time><button class="rowbtn danger" onclick="deleteJournal('${id}','${j.id}')" aria-label="Delete journal entry">Delete</button></div><div class="journaltext">${esc(j.text)}</div></div>`).join('')||'<p class="muted subtle">No entries yet. Start their story here. ✦</p>'}</div><div class="sectionhead"><h3>Heart history</h3></div>${activity.map(e=>`<div class="event"><time>${fmt(e.date)}</time><div>${esc(e.text)}</div></div>`).join('')||'<p class="muted subtle">No rating changes yet.</p>'}<div class="actions"><button class="ghost" onclick="openAdd('${id}')">Edit profile</button>${p.retired?`<button class="primary" onclick="reinstatePerson('${id}')">♥ Return to roster</button>`:`<button class="ghost danger" onclick="retirePerson('${id}')">❄ Retire person</button>`}</div>`)}function openQuickNote(type){if(!state.people.some(x=>!x.retired)){toast('Add someone to your roster first');return}modal(`<div class="modalheader"><h2>${type==='pinned'?'Pinned note':'Journal entry'}</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><form onsubmit="saveQuickNote(event,'${type}')"><label class="formlabel">Who is this about?</label><select class="field" name="person" required>${state.people.filter(x=>!x.retired).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}${p.nickname?' · '+esc(p.nickname):''}</option>`).join('')}</select>${type==='journal'?`<label class="formlabel">When did it happen?</label><input class="field" type="date" name="entryDate" required value="${todayLocal()}">`:``}<label class="formlabel">${type==='pinned'?'Add to their pinned notes':'What happened?'}</label><textarea class="field" name="entry" required maxlength="5000" placeholder="${type==='pinned'?'Something worth remembering...':'Today they made me laugh...'}"></textarea><div class="actions"><button class="ghost" type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">＋ Save ${type==='pinned'?'pinned note':'journal entry'}</button></div></form>`)}function saveQuickNote(e,type){e.preventDefault();let f=new FormData(e.target),p=state.people.find(x=>x.id===f.get('person')&&!x.retired),entry=String(f.get('entry')||'').trim();if(!p||!entry)return;if(type==='pinned')p.notes=[p.notes,entry].filter(Boolean).join('\n');else{if(!Array.isArray(p.journal))p.journal=[];p.journal.push({id:uid(),date:journalDate(f.get("entryDate")),text:entry})}save();closeModal();render();toast(type==='pinned'?'Pinned note saved ✦':'Journal entry saved ✦')}function openPinnedNote(id){let p=state.people.find(x=>x.id===id);if(!p)return;modal(`<div class="modalheader"><h2>Pinned notes · ${esc(p.name)}</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><form onsubmit="savePinnedNote(event,'${id}')"><label class="formlabel">Keep important details visible on their roster card</label><textarea class="field" name="notes" maxlength="5000" placeholder="What should you remember?">${esc(p.notes||'')}</textarea><div class="actions"><button type="button" class="ghost" onclick="openProfile('${id}')">Back</button><button type="submit" class="primary">＋ Save pinned notes</button></div></form>`)}function savePinnedNote(e,id){e.preventDefault();let p=state.people.find(x=>x.id===id);if(!p)return;p.notes=String(new FormData(e.target).get('notes')||'').trim();save();render();openProfile(id);toast('Pinned notes updated ✦')}function addJournal(e,id){e.preventDefault();let p=state.people.find(x=>x.id===id);if(!p)return;let entry=String(new FormData(e.target).get('entry')||'').trim();if(!entry)return;if(!Array.isArray(p.journal))p.journal=[];p.journal.push({id:uid(),date:journalDate(new FormData(e.target).get("entryDate")),text:entry});save();openProfile(id);toast('Added to their file ✦')}function deleteJournal(id,jid){let p=state.people.find(x=>x.id===id);if(!p||!confirm('Delete this journal entry?'))return;p.journal=(p.journal||[]).filter(j=>j.id!==jid);save();openProfile(id);toast('Entry removed')}function deletePerson(id){let p=state.people.find(x=>x.id===id);if(!p||!confirm(`Remove ${p.name} from your roster?`))return;state.people=state.people.filter(x=>x.id!==id);save();closeModal();render();toast('Removed from the roster')}function changeReset(v){state.reset=v;state.lastReset=new Date().toISOString();save();toast('Restoration rule saved')}function restoreAll(){if(!confirm('Restore everyone to five hearts?'))return;state.people.filter(x=>!x.retired).forEach(x=>x.stars=5);state.lastReset=new Date().toISOString();state.events.unshift({id:uid(),date:new Date().toISOString(),text:'Everyone restored to five hearts'});save();render();toast('Fresh start for everyone ✦')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-black-book-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported')}async function importData(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.people)||!Array.isArray(d.events)||!['never','daily','weekly'].includes(d.reset)||d.people.some(x=>typeof x.id!=='string'||typeof x.name!=='string'||!Number.isInteger(x.stars)||x.stars<0||x.stars>5))throw Error('Invalid backup');if(!confirm('Replace all current roster data with this backup?'))return;state=d;save();render();toast('Backup imported')}catch(err){alert('That file is not a valid Black Book backup.')}e.target.value=''}function clearData(){if(!confirm('Permanently erase all profiles and history from this browser? Export a backup first if needed.'))return;state={people:[],reset:'never',events:[],lastReset:new Date().toISOString()};save();render();toast('Roster erased')}render();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
